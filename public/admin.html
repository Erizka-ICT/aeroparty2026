<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AeroParty Admin</title><link rel="stylesheet" href="/styles.css"></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">A</span><span>AEROPARTY <b>2026</b> / ADMIN</span></a><button class="ghost-btn" onclick="loadAll()">Refresh</button></header><main class="section-pad"><div class="eyebrow">CONTROL CENTER</div><h1 style="font-family:Cinzel,serif;font-size:48px;margin:0 0 35px">Booking Dashboard</h1><div id="stats" class="class-grid"></div><div style="margin-top:45px;overflow:auto"><table id="table" style="width:100%;border-collapse:collapse;min-width:900px;font-size:13px"></table></div></main><script>const money=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);async function api(u,o){let r=await fetch(u,o);let d=await r.json();if(!r.ok)throw Error(d.error);return d}async function loadAll(){try{const [s,b]=await Promise.all([api('/api/admin/stats'),api('/api/admin/bookings')]);document.querySelector('#stats').innerHTML=[['Paid',s.paid],['Pending',s.pending],['Available',s.available],['Revenue',money(s.revenue)]].map(x=>`<article class="class-card"><span class="number">AEROPARTY</span><h3 style="font-size:34px">${x[1]}</h3><p>${x[0]}</p></article>`).join('');document.querySelector('#table').innerHTML='<tr style="text-align:left;border-bottom:1px solid #304052"><th>Order</th><th>Name</th><th>Class</th><th>Step</th><th>Bank</th><th>Status</th><th>Amount</th><th>Created</th></tr>'+b.map(x=>`<tr style="border-bottom:1px solid #172535"><td style="padding:12px">${x.order_id}</td><td>${x.full_name}</td><td>${x.class_name}</td><td>${x.step_number}</td><td>${x.bank||'-'}</td><td>${x.status}</td><td>${money(x.amount)}</td><td>${new Date(x.created_at).toLocaleString('id-ID')}</td></tr>`).join('')}catch(e){document.body.insertAdjacentHTML('beforeend',`<p style="padding:20px;color:#e4a65a">${e.message}</p>`)}}loadAll()</script></body></html>
