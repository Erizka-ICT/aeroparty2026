services:
  - type: web
    name: aeroparty-2026
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: APP_NAME
        value: AeroParty 2026
      - key: MIDTRANS_ENV
        value: sandbox
      - key: STEP_PRICE_IDR
        value: 150000
      - key: PAYMENT_EXPIRY_MINUTES
        value: 60
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aeroparty-db
          property: connectionString
      - key: MIDTRANS_SERVER_KEY
        sync: false
  - type: pserv
    name: aeroparty-db
    plan: starter
    runtime: postgres
    ipAllowList: []
